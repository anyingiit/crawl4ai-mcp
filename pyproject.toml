[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl4ai-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "crawl4ai==0.9.2",
  "curl_cffi>=0.16,<0.17",
  "fastmcp>=3.4,<3.5",
  "aiosqlite>=0.20,<0.22",
  "httpx[http2]>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
camoufox = ["camoufox>=0.5,<0.6"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.22,<1"]

[project.scripts]
crawl4ai-mcp = "crawl4ai_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: network-backed tests; opt in with CRAWL4AI_MCP_LIVE_TESTS=1",
  "acceptance_required: must pass for complete deployment acceptance",
  "acceptance_optional: may skip only when the provider is disabled or unconfigured",
]
